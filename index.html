<link rel="stylesheet" href="style.css">

<div class="card">

    <h1>IdeaSpark AI</h1>

    <p>Turn a rough idea into something you can build.</p>

    <input id="ideaInput" placeholder="Describe your idea...">

    <button onclick="generateIdea()">Generate Idea</button>

    <p id="result">Your AI idea will appear here.</p>

</div>

<script>
    async function generateIdea() {
        const idea = document.getElementById("ideaInput").value;

        const response = await fetch("http://localhost:3000/api/idea", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ idea: idea })
        });

        const result = await response.text();
        const data = JSON.parse(result);

        const resultBox = document.getElementById("result");

        resultBox.textContent = "";

        const title = document.createElement("h2");
        title.textContent = data.projectName;
        resultBox.appendChild(title);

        const description = document.createElement("p");
        description.textContent = data.description;
        resultBox.appendChild(description);

        const featuresTitle = document.createElement("h3");
        featuresTitle.textContent = "Key Features";
        resultBox.appendChild(featuresTitle);

        const featuresList = document.createElement("ul");
        data.features.forEach(feature => {
            const item = document.createElement("li");
            item.textContent = feature;
            featuresList.appendChild(item);
        });
        resultBox.appendChild(featuresList);

        const audience = document.createElement("p");
        audience.textContent = "For: " + data.audience;
        resultBox.appendChild(audience);
    }
</script>
