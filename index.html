<link rel="stylesheet" href="style.css">

<div class="card">

    <h1>IdeaSpark AI</h1>

    <p>Turn a rough idea into something you can build.</p>

    <input id="ideaInput" placeholder="Describe your idea...">

    <button onclick="generateIdea()">Generate Idea</button>

    <p id="result">Your AI idea will appear here.</p>

</div>

<script>
    async function generateIdea() {
        const idea = document.getElementById("ideaInput").value;

        const response = await fetch("http://localhost:3000/api/idea", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ idea: idea })
        });

        const result = await response.text();

        document.getElementById("result").textContent = result;
    }
</script>
